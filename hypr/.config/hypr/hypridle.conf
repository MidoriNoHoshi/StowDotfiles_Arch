# Idle power management (pacman -S hypridle; started from hyprland.lua).
# Apps that hold an idle inhibitor (video playback in the browser, mpv, ...)
# pause all of these timers automatically.

$pause_ambient = $XDG_RUNTIME_DIR/ambient-brightness.pause

general {
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 2 min: dim to 5%. The pause flag stops ambient-brightness from undoing it.
listener {
    timeout = 120
    on-timeout = touch $pause_ambient; brightnessctl -s set 5%
    on-resume = brightnessctl -r; rm -f $pause_ambient
}

# 5 min: panel off.
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 20 min: suspend, but only when running on battery.
listener {
    timeout = 1200
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online)" = 0 ] && systemctl suspend
}
